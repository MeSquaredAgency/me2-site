# Publishes the site to the Me² Cloudflare account (Worker "mesquared") on every push.
#   main         → npx wrangler deploy          → live on mesquaredagency.com
#   other branch → npx wrangler versions upload → a preview URL (not live), shown in the run summary
# Why GitHub Actions and not Cloudflare's own Git builds: the MeSquaredAgency GitHub organisation is
# already linked to a different Cloudflare account (APN's, for the APNRE site), and a GitHub account can
# only point to one Cloudflare account. See DEPLOY.md.
name: Publish to Cloudflare

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch at a time. A newer push to a preview branch replaces an older run;
  # runs on main always finish, so a live deploy is never cut off halfway.
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the Cloudflare token is set
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN secret yet, so nothing was published. Add it in GitHub → Settings → Secrets and variables → Actions (see DEPLOY.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
        with:
          # Full history, so scripts/postbuild.mjs can date the sitemap's lastmod from the last commit that changed the site.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: npm ci

      - name: Build
        if: steps.token.outputs.ok == 'true'
        run: npm run build

      - name: Publish live (main)
        if: steps.token.outputs.ok == 'true' && github.ref == 'refs/heads/main'
        run: |
          npx wrangler deploy --message "main ${GITHUB_SHA::7}" | tee wrangler.log
          {
            echo "### Live on https://mesquaredagency.com"
            echo "Commit \`${GITHUB_SHA::7}\` is now live. Roll back with \`npx wrangler rollback\` (see DEPLOY.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload a preview (other branches)
        if: steps.token.outputs.ok == 'true' && github.ref != 'refs/heads/main'
        run: |
          npx wrangler versions upload --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" | tee wrangler.log
          url=$(grep -o 'https://[^ ]*workers\.dev[^ ]*' wrangler.log | tail -1)
          {
            echo "### Preview of \`${GITHUB_REF_NAME}\` (not live)"
            echo "${url:-Preview URL not found; see the log above.}"
          } >> "$GITHUB_STEP_SUMMARY"
